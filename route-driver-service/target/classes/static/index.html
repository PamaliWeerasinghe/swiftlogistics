<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftDriver — Mobile Companion App (:8006)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #090d16; color: #f1f5f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .phone-frame { width: 100%; max-width: 460px; background-color: #111827; border: 2px solid #1f2937; border-radius: 24px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .app-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; padding-bottom: 14px; margin-bottom: 16px; }
        .app-header h2 { margin: 0; font-size: 1.2rem; color: #38bdf8; }
        .live-dot { background: #10b981; color: #064e3b; font-weight: 700; font-size: 0.72rem; padding: 4px 10px; border-radius: 999px; }
        .live-dot.offline { background: #ef4444; color: #fff; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .order-id { font-weight: 700; font-size: 1.05rem; color: #f8fafc; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
        .ASSIGNED { background-color: #3b82f633; color: #60a5fa; border: 1px solid #3b82f6; }
        .IN_TRANSIT { background-color: #f59e0b33; color: #fbbf24; border: 1px solid #f59e0b; }
        .DELIVERED { background-color: #10b98133; color: #34d399; border: 1px solid #10b981; }
        .FAILED_ATTEMPT { background-color: #ef444433; color: #f87171; border: 1px solid #ef4444; }
        .meta { font-size: 0.85rem; color: #94a3b8; margin: 4px 0; }
        .meta strong { color: #e2e8f0; }
        .pod-input { width: 100%; box-sizing: border-box; margin-top: 10px; padding: 8px 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 0.82rem; }
        .btn-row { display: flex; gap: 8px; margin-top: 10px; }
        button { flex: 1; padding: 9px 6px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.78rem; cursor: pointer; color: white; }
        .btn-transit { background-color: #d97706; }
        .btn-deliver { background-color: #059669; }
        .btn-fail { background-color: #dc2626; }
        button:hover { opacity: 0.9; }
        .empty { text-align: center; color: #64748b; padding: 40px 10px; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="phone-frame">
    <div class="app-header">
        <div>
            <h2>🚚 SwiftDriver App</h2>
            <small style="color:#94a3b8;">Route & Driver Service (:8006)</small>
        </div>
        <span id="syncStatus" class="live-dot">LIVE SYNC</span>
    </div>

    <div id="manifestList">
        <div class="empty">No active route manifests assigned yet.<br>Waiting for ROS Adapter...</div>
    </div>
</div>

<script>
    const API = "/api/driver";

    async function loadManifests() {
        const statusBadge = document.getElementById("syncStatus");
        try {
            const res = await fetch(`${API}/manifests`, { cache: "no-store" });
            if (!res.ok) throw new Error(`Driver service returned HTTP ${res.status}`);
            const list = await res.json();
            const container = document.getElementById("manifestList");

            statusBadge.textContent = "LIVE SYNC";
            statusBadge.className = "live-dot";

            if (!list.length) {
                container.innerHTML = '<div class="empty">No active route manifests assigned yet.<br>Waiting for ROS Adapter...</div>';
                return;
            }

            container.innerHTML = list.map(item => `
                <div class="card">
                    <div class="card-top">
                        <span class="order-id">📦 ${item.orderId}</span>
                        <span class="badge ${item.deliveryStatus}">${item.deliveryStatus}</span>
                    </div>
                    <div class="meta">🗺️ <strong>Route:</strong> ${item.routeId} (${item.estimatedDistanceKm} km • ~${item.estimatedEtaMinutes} mins)</div>
                    <div class="meta">📍 <strong>Drop-off:</strong> ${item.address}</div>
                    <div class="meta">🧑‍✈️ <strong>Driver:</strong> ${item.assignedDriver} (${item.assignedVehicle})</div>
                    <div class="meta">📝 <strong>PoD Note:</strong> ${item.podNotes} <small>(${item.updatedAt})</small></div>

                    <input id="note-${item.orderId}" class="pod-input" placeholder="Optional Proof of Delivery / Recipient note..." />
                    <div class="btn-row">
                        <button class="btn-transit" onclick="updateStatus('${item.orderId}', 'IN_TRANSIT', 'Parcel picked up, en route')">🚚 En Route</button>
                        <button class="btn-deliver" onclick="updateStatus('${item.orderId}', 'DELIVERED', 'Signed by recipient at gate')">✔ Delivered</button>
                        <button class="btn-fail" onclick="updateStatus('${item.orderId}', 'FAILED_ATTEMPT', 'Recipient unavailable')">⚠ Issue</button>
                    </div>
                </div>
            `).join('');
        } catch (err) {
            statusBadge.textContent = "OFFLINE";
            statusBadge.className = "live-dot offline";
            document.getElementById("manifestList").innerHTML = '<div class="empty">Driver service is unreachable.<br>Start Route & Driver Service on port 8006.</div>';
            console.error("Failed to fetch driver manifests:", err);
        }
    }

    async function updateStatus(orderId, status, defaultNote) {
        const inputEl = document.getElementById(`note-${orderId}`);
        const customNote = inputEl && inputEl.value.trim() ? inputEl.value.trim() : defaultNote;

        await fetch(`${API}/manifests/${orderId}/status`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: status, podNotes: customNote })
        });
        loadManifests();
    }

    setInterval(loadManifests, 2500);
    window.onload = loadManifests;
</script>
</body>
</html>
