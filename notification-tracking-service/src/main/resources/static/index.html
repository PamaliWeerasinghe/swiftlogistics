<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SwiftLogistics – Live Order Tracking & Notification Hub (:8007)</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #0b0f19; color: #e2e8f0; margin: 0; padding: 24px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
        .header { max-width: 1200px; margin: 0 auto 20px auto; border-bottom: 1px solid #1e293b; padding-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: #a855f7; margin: 0; font-size: 1.45rem; }
        .badge-live { background: #9333ea33; color: #c084fc; border: 1px solid #9333ea; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 0.82rem; }
        .panel { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 18px; }
        .panel h3 { margin-top: 0; color: #f8fafc; border-bottom: 1px solid #1f2937; padding-bottom: 10px; }
        .order-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .order-id { font-weight: 700; color: #38bdf8; font-size: 1.05rem; }
        .stage-pill { background: #10b98133; color: #34d399; border: 1px solid #10b981; padding: 3px 10px; border-radius: 999px; font-size: 0.76rem; font-weight: 700; }
        .stage-pill.failed { background: #ef444433; color: #f87171; border-color: #ef4444; }
        .progress-track { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 12px 0; }
        .step-item { display: flex; flex-direction: column; gap: 5px; }
        .step-bar { height: 6px; border-radius: 4px; background: #334155; transition: background-color 0.2s ease; }
        .step-item.done .step-bar { background: #a855f7; }
        .step-item.current .step-bar { background: #38bdf8; box-shadow: 0 0 8px #38bdf880; }
        .step-item.failed .step-bar { background: #ef4444; box-shadow: 0 0 8px #ef444480; }
        .step-label { font-size: 0.71rem; color: #64748b; text-align: center; line-height: 1.2; }
        .step-item.done .step-label { color: #c084fc; }
        .step-item.current .step-label { color: #f8fafc; font-weight: 700; }
        .step-item.failed .step-label { color: #f87171; font-weight: 700; }
        .notif-item { background: #0f172a; border-left: 3px solid #a855f7; padding: 10px 12px; margin-bottom: 10px; border-radius: 6px; font-size: 0.83rem; }
        .notif-time { color: #64748b; font-size: 0.74rem; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>
<div class="header">
    <h1>🔔 SWIFT-TRACKING & NOTIFICATION CENTER (:8007)</h1>
    <span class="badge-live">COMPETING CONSUMERS ACTIVE</span>
</div>

<div class="container">
    <div class="panel">
        <h3>📦 Real-Time Order Lifecycle Tracker</h3>
        <div id="ordersContainer">
            <p style="color:#64748b; text-align:center;">No tracking events received yet. Waiting for order.tracking.queue...</p>
        </div>
    </div>

    <div class="panel">
        <h3>✉️ Outbound SMS / Email Alert Feed</h3>
        <div id="notifContainer">
            <p style="color:#64748b; text-align:center;">No notifications dispatched yet.</p>
        </div>
    </div>
</div>

<script>
    const API = "http://localhost:8007/api/tracking";

    const PHASES = [
        { rank: 1, key: "ORDER_RECEIVED",  label: "1. Order Received",  desc: "Order submitted to intake" },
        { rank: 2, key: "CMS_VERIFIED",    label: "2. Order Verified",  desc: "Verified by client system (CMS)" },
        { rank: 3, key: "WMS_ALLOCATED",   label: "3. Warehouse Ready", desc: "Allocated & packed in warehouse (WMS)" },
        { rank: 4, key: "ROUTE_OPTIMIZED", label: "4. Route Planned",   desc: "Delivery route & vehicle assigned (ROS)" },
        { rank: 5, key: "IN_TRANSIT",      label: "5. Out for Delivery",desc: "Driver en route to destination" },
        { rank: 6, key: "DELIVERED",       label: "6. Delivered",       desc: "Package delivered to recipient" }
    ];

    async function refresh() {
        try {
            const [ordRes, notifRes] = await Promise.all([
                fetch(`${API}/orders`),
                fetch(`${API}/notifications`)
            ]);
            const orders = await ordRes.json();
            const notifs = await notifRes.json();

            const ordContainer = document.getElementById("ordersContainer");
            if (orders.length > 0) {
                ordContainer.innerHTML = orders.map(o => {
                    const rank = o.currentRank || 1;
                    const isFailed = o.currentStage === "FAILED_ATTEMPT";

                    const stepsHtml = PHASES.map(p => {
                        let stateClass = "";
                        let label = p.label;
                        let title = p.desc;

                        if (p.rank === 6 && isFailed) {
                            stateClass = "failed";
                            label = "6. Delivery Failed";
                            title = "Delivery attempt failed";
                        } else if (p.rank < rank) {
                            stateClass = "done";
                        } else if (p.rank === rank) {
                            stateClass = "current";
                        }

                        return `
                            <div class="step-item ${stateClass}" title="${title}">
                                <div class="step-bar"></div>
                                <span class="step-label">${label}</span>
                            </div>
                        `;
                    }).join("");

                    return `
                        <div class="order-card">
                            <div class="order-header">
                                <span class="order-id">${o.orderId} <span style="font-size:0.8rem; color:#94a3b8; font-weight:normal;">(${o.clientId})</span></span>
                                <span class="stage-pill ${isFailed ? 'failed' : ''}">${o.currentStage}</span>
                            </div>
                            <div class="progress-track">${stepsHtml}</div>
                            <div style="font-size:0.85rem; color:#cbd5e1;">${o.latestDetails}</div>
                            <div style="font-size:0.75rem; color:#64748b; margin-top:6px;">Last Updated: ${o.updatedAt}</div>
                        </div>
                    `;
                }).join("");
            }

            const notifContainer = document.getElementById("notifContainer");
            if (notifs.length > 0) {
                notifContainer.innerHTML = notifs.slice(0, 20).map(n => `
                    <div class="notif-item">
                        <span class="notif-time">${n.timestamp} • ${n.stage}</span>
                        ${n.message}
                    </div>
                `).join("");
            }
        } catch (e) {}
    }

    setInterval(refresh, 1500);
    refresh();
</script>
</body>
</html>
