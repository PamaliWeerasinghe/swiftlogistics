<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SwiftLogistics — Live Order Tracking & Notification Hub (:8007)</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #0b0f19; color: #e2e8f0; margin: 0; padding: 24px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
        .header { max-width: 1200px; margin: 0 auto 20px auto; border-bottom: 1px solid #1e293b; padding-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: #a855f7; margin: 0; font-size: 1.45rem; }
        .badge-live { background: #9333ea33; color: #c084fc; border: 1px solid #9333ea; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 0.82rem; }
        .panel { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 18px; }
        .panel h3 { margin-top: 0; color: #f8fafc; border-bottom: 1px solid #1f2937; padding-bottom: 10px; }
        .order-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .order-id { font-weight: 700; color: #38bdf8; font-size: 1.05rem; }
        .stage-pill { background: #10b98133; color: #34d399; border: 1px solid #10b981; padding: 3px 10px; border-radius: 999px; font-size: 0.76rem; font-weight: 700; }
        .progress-bar { display: flex; gap: 6px; margin: 10px 0; }
        .step { flex: 1; height: 6px; border-radius: 4px; background: #334155; }
        .step.active { background: #a855f7; }
        .notif-item { background: #0f172a; border-left: 3px solid #a855f7; padding: 10px 12px; margin-bottom: 10px; border-radius: 6px; font-size: 0.83rem; }
        .notif-time { color: #64748b; font-size: 0.74rem; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>
<div class="header">
    <h1>🔔 SWIFT-TRACKING & NOTIFICATION CENTER (:8007)</h1>
    <span class="badge-live">COMPETING CONSUMERS ACTIVE</span>
</div>

<div class="container">
    <div class="panel">
        <h3>📦 Real-Time Order Lifecycle Tracker</h3>
        <div id="ordersContainer">
            <p style="color:#64748b; text-align:center;">No tracking events received yet. Waiting for order.tracking.queue...</p>
        </div>
    </div>

    <div class="panel">
        <h3>📨 Outbound SMS / Email Alert Feed</h3>
        <div id="notifContainer">
            <p style="color:#64748b; text-align:center;">No notifications dispatched yet.</p>
        </div>
    </div>
</div>

<script>
    const API = "http://localhost:8007/api/tracking";

    async function refreshPortal() {
        try {
            const orders = await (await fetch(`${API}/orders`)).json();
            const ordersEl = document.getElementById("ordersContainer");
            if (orders.length > 0) {
                ordersEl.innerHTML = orders.map(o => {
                    const rank = o.currentRank || 1;
                    const steps = [1, 2, 3, 4, 5, 6].map(i =>
                        `<div class="step ${i <= rank ? 'active' : ''}"></div>`
                    ).join('');
                    return `
                        <div class="order-card">
                            <div class="order-header">
                                <span class="order-id">${o.orderId} <small style="color:#94a3b8;">(${o.clientId})</small></span>
                                <span class="stage-pill">${o.currentStage}</span>
                            </div>
                            <div class="progress-bar">${steps}</div>
                            <div style="font-size:0.86rem; color:#cbd5e1;">${o.latestDetails}</div>
                            <small style="color:#64748b;">Last updated: ${o.updatedAt}</small>
                        </div>
                    `;
                }).join('');
            }

            const notifs = await (await fetch(`${API}/notifications`)).json();
            const notifEl = document.getElementById("notifContainer");
            if (notifs.length > 0) {
                notifEl.innerHTML = notifs.slice(0, 15).map(n => `
                    <div class="notif-item">
                        <span class="notif-time">${n.timestamp} • ${n.stage}</span>
                        ${n.message}
                    </div>
                `).join('');
            }
        } catch (e) { console.error(e); }
    }

    setInterval(refreshPortal, 2000);
    window.onload = refreshPortal;
</script>
</body>
</html>
