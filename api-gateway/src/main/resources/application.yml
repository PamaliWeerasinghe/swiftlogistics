server:
  port: 8000

security:
  enforce-token: false
  jwt-secret: swift-local-dev-secret
  token-ttl-minutes: 180

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                  - "http://localhost:4173"
                  - "http://localhost:8080"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - AddResponseHeader=X-Frame-Options, SAMEORIGIN
          routes:
            - id: order-intake-route
              uri: http://localhost:8001
              predicates:
                - Path=/api/v1/orders,/api/v1/orders/**,/api/orders/**
            - id: notification-tracking-route
              uri: http://localhost:8007
              predicates:
                - Path=/api/tracking/**
            - id: route-driver-route
              uri: http://localhost:8006
              predicates:
                - Path=/api/driver/**

  codec:
    max-in-memory-size: 20MB