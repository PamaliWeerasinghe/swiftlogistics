<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CloudRoute SaaS — Route Optimization Console (:8082)</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #0b1120; color: #e2e8f0; padding: 24px; }
        .container { max-width: 1150px; margin: 0 auto; }
        .header { border-bottom: 1px solid #1e293b; padding-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: #38bdf8; margin: 0; font-size: 1.4rem; }
        .badge { padding: 6px 14px; font-weight: 600; border-radius: 6px; margin-right: 10px; font-size: 0.85rem; }
        .online { background-color: #059669; color: #fff; }
        .offline { background-color: #dc2626; color: #fff; }
        button { background-color: #1e293b; color: #f8fafc; border: 1px solid #334155; padding: 8px 16px; cursor: pointer; border-radius: 6px; }
        button:hover { background-color: #334155; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #0f172a; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 14px; border-bottom: 1px solid #1e293b; text-align: left; }
        th { background-color: #1e293b; color: #94a3b8; font-size: 0.85rem; text-transform: uppercase; }
        .route-id { color: #38bdf8; font-weight: bold; font-family: monospace; }
        .vehicle { color: #34d399; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🛰️ CLOUD-ROS VENDOR API MONITOR (:8082)</h1>
        <div>
            <span id="statusBadge" class="badge online">API ONLINE (REST 200)</span>
            <button onclick="toggleCloud()">Toggle Cloud Outage</button>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>Timestamp</th>
            <th>Route ID</th>
            <th>Order ID</th>
            <th>Destination</th>
            <th>Assigned Vehicle</th>
            <th>Distance / ETA</th>
        </tr>
        </thead>
        <tbody id="routesBody">
        <tr><td colspan="6" style="text-align:center; color:#64748b;">Waiting for REST API optimization requests...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const API = "http://localhost:8082/api/mock-ros";
    async function refresh() {
        try {
            const st = await (await fetch(`${API}/status`)).json();
            const badge = document.getElementById("statusBadge");
            badge.textContent = st.online ? "API ONLINE (REST 200)" : "API OFFLINE (REST 503)";
            badge.className = st.online ? "badge online" : "badge offline";

            const routes = await (await fetch(`${API}/routes`)).json();
            const tbody = document.getElementById("routesBody");
            if (!routes.length) return;
            tbody.innerHTML = routes.map(r => `
                <tr>
                    <td>${r.timestamp}</td>
                    <td class="route-id">${r.routeId}</td>
                    <td><strong>${r.orderId}</strong></td>
                    <td>${r.destination}</td>
                    <td class="vehicle">${r.assignedVehicle}</td>
                    <td>${r.distanceKm} • ${r.etaMins}</td>
                </tr>
            `).join('');
        } catch (e) { console.error(e); }
    }
    async function toggleCloud() { await fetch(`${API}/toggle`, { method: 'POST' }); refresh(); }
    setInterval(refresh, 2000);
    window.onload = refresh;
</script>
</body>
</html>
